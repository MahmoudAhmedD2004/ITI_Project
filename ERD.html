
<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  AUTHOR ||--o{ BOOK : writes
  CATEGORY ||--o{ BOOK : classifies
  BOOK ||--o{ BOOKCOPY : has_copies
  BOOK ||--o| EBOOK : has_ebook
  BOOK ||--o{ REVIEW : receives
  BOOK ||--o{ RESERVATION : reserved_in
  BOOK ||--o{ FAVORITE : favorited_in
  MEMBER ||--o{ REVIEW : writes
  MEMBER ||--o{ RESERVATION : makes
  MEMBER ||--o{ LOAN : takes
  MEMBER ||--o{ FAVORITE : marks
  BOOKCOPY ||--o{ LOAN : loaned_as
  LOAN ||--o| FINE : may_incur

  AUTHOR {
    int id PK
    string name
    string bio
    string photo
  }
  CATEGORY {
    int id PK
    string name
    string description
  }
  BOOK {
    int id PK
    string title
    string isbn
    string summary
    string book_language
    int published_year
    string cover_image
    int author_id FK
    int category_id FK
  }
  BOOKCOPY {
    int id PK
    string barcode
    string status
    int book_id FK
  }
  EBOOK {
    int id PK
    int book_id FK
    string file_path
    string original_file_name
    datetime uploaded_date
  }
  MEMBER {
    int id PK
    string user_name
    string email
    string phone_number
    string password_hash
    string role
    datetime membership_start_date
    datetime membership_expiry_date
    bool is_blocked
  }
  LOAN {
    int id PK
    datetime request_date
    datetime borrow_date
    datetime due_date
    datetime return_date
    string status
    string rejection_reason
    int book_copy_id FK
    int member_id FK
  }
  FINE {
    int id PK
    decimal amount
    datetime created_date
    bool is_paid
    int loan_id FK
  }
  RESERVATION {
    int id PK
    int book_id FK
    int member_id FK
    datetime reservation_date
    string status
  }
  REVIEW {
    int id PK
    int rating
    string comment
    datetime created_date
    int book_id FK
    int member_id FK
  }
  FAVORITE {
    int id PK
    int member_id FK
    int book_id FK
    datetime added_date
  }
`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
